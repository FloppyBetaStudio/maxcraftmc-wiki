{{ define "main" }}
<main id="main-content" class="mc-page" tabindex="-1">
    <header class="mc-page-hero">
        <div class="mc-page-hero__inner">
            <p class="mc-kicker">Lost chunk · 404</p>
            <h1>这片区块还没有生成</h1>
            <p>你访问的页面不存在、已移动，或输入的地址有误。</p>
        </div>
    </header>
    <div class="mc-page-shell">
        <div class="mc-page-content mc-not-found">
            <div class="mc-server-icon" aria-hidden="true">?</div>
            <p>可以从主世界重新出发，或搜索 Wiki 中的服务器资料。</p>
            <div class="mc-quick-actions">
                <a class="mc-button mc-button-primary" href="/">返回首页</a>
                <a class="mc-button mc-button-secondary" href="/search/">搜索 Wiki</a>
                <a class="mc-button mc-button-secondary" href="/posts/guide/">查看新玩家指南</a>
            </div>
        </div>
    </div>
</main>
{{ end }}
